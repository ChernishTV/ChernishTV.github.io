<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chernish</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

  <link rel="stylesheet" href="style.css?v=7.0" />
</head>

<body>
  <!-- Фоновый космос / частицы при наведении -->
  <canvas id="stars"></canvas>

  <!-- Полноэкранный слой для водопада и взрыва сердечек -->
  <canvas id="hearts-transition"></canvas>

  <div id="container">
    <!-- Profile Header -->
    <div id="user">
      <div class="avatar-wrapper">
        <img id="avatar-img" src="avatar.png?v=7.0" alt="Chernish Avatar" draggable="false" title="Кликни по аватарке 20 раз..." />
      </div>

      <p class="nickname channel-split-wrapper">@Chernish</p>

      <div class="status-badge" id="bio-badge">
        <span class="status-dot"></span>
        <span id="bio-text">steam profile</span>
      </div>
    </div>

    <!-- Cards Grid -->
    <main id="cards-grid"></main>
  </div>

  <!-- Всплывающее уведомление (Toast) без молнии -->
  <div id="toast">
    <span class="toast-heart">❤</span>
    <span id="toast-text"></span>
  </div>

  <!-- Конфигурация и скрипты -->
  <script src="config.js?v=7.0"></script>
  <script src="background.js?v=7.0"></script>
  <script src="pixels.js?v=7.0"></script>
</body>
</html>
